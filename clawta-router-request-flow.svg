<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Clawta Router Request Flow</title>
  <desc id="desc">Client requests flow through Clawta Router intent classification, policy matrix, escalating dispatch, then either Ollama local or Codex escalation before returning a streamed response. Memory and turn-ledger are shown as sidecars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="55%" stop-color="#0d1728"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="router" x1="0" x2="1">
      <stop offset="0%" stop-color="#214e7b"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="local" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="codex" x1="0" x2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#fbbf24"/>
    </marker>
    <style>
      .label { font: 700 24px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .small { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #cbd5e1; }
      .tiny { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #94a3b8; }
      .chip { font: 700 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #dbeafe; letter-spacing: .04em; }
      .box { rx: 22; filter: url(#shadow); stroke: rgba(255,255,255,.18); stroke-width: 1.5; }
      .step { rx: 16; fill: rgba(15,23,42,.72); stroke: rgba(191,219,254,.35); stroke-width: 1.2; }
      .flow { fill: none; stroke: #93c5fd; stroke-width: 4; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke: #fbbf24; stroke-width: 4; marker-end: url(#arrowGold); stroke-linecap: round; stroke-dasharray: 12 10; }
      .side { fill: rgba(15,23,42,.72); stroke: rgba(125,211,252,.35); stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .sideLine { fill: none; stroke: #67e8f9; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrow); opacity: .8; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="110" cy="95" r="180" fill="#2563eb" opacity=".10"/>
  <circle cx="1115" cy="620" r="230" fill="#7c3aed" opacity=".11"/>

  <text x="64" y="70" class="label">Clawta Router request flow</text>
  <text x="64" y="98" class="small">Intent-aware routing with local-first policy and explicit escalation lane</text>

  <!-- Client -->
  <rect x="70" y="265" width="170" height="118" class="box" fill="#172554"/>
  <text x="155" y="315" text-anchor="middle" class="label">Client</text>
  <text x="155" y="345" text-anchor="middle" class="small">OpenAI-compatible</text>

  <!-- Router container -->
  <rect x="310" y="190" width="430" height="270" class="box" fill="url(#router)"/>
  <text x="525" y="234" text-anchor="middle" class="label">Router</text>
  <text x="525" y="260" text-anchor="middle" class="tiny">classify, constrain, dispatch</text>

  <rect x="350" y="292" width="350" height="48" class="step"/>
  <text x="525" y="322" text-anchor="middle" class="small">1. intent classify</text>
  <rect x="350" y="354" width="350" height="48" class="step"/>
  <text x="525" y="384" text-anchor="middle" class="small">2. policy matrix</text>
  <rect x="350" y="416" width="350" height="48" class="step"/>
  <text x="525" y="446" text-anchor="middle" class="small">3. escalating dispatch</text>

  <!-- Provider lanes -->
  <rect x="825" y="168" width="255" height="120" class="box" fill="url(#local)"/>
  <text x="952" y="218" text-anchor="middle" class="label">Ollama local</text>
  <text x="952" y="248" text-anchor="middle" class="small">default / quota-safe lane</text>

  <rect x="825" y="365" width="255" height="120" class="box" fill="url(#codex)"/>
  <text x="952" y="415" text-anchor="middle" class="label">Codex escalation</text>
  <text x="952" y="445" text-anchor="middle" class="small">hard-model fallback</text>

  <!-- Streamed response -->
  <rect x="1115" y="265" width="120" height="118" class="box" fill="#312e81"/>
  <text x="1175" y="308" text-anchor="middle" class="small">streamed</text>
  <text x="1175" y="334" text-anchor="middle" class="label">response</text>

  <!-- Sidecar -->
  <rect x="320" y="520" width="520" height="125" class="side"/>
  <text x="354" y="560" class="label">Sidecar state</text>
  <text x="354" y="592" class="small">memory: persistent context + policy hints</text>
  <text x="354" y="620" class="small">turn-ledger: request facts, decisions, escalation trace</text>
  <rect x="732" y="542" width="76" height="28" rx="14" fill="rgba(14,165,233,.18)" stroke="rgba(125,211,252,.45)"/>
  <text x="770" y="561" text-anchor="middle" class="chip">read/write</text>

  <!-- Main arrows -->
  <path d="M240 324 C265 324 282 324 310 324" class="flow"/>
  <path d="M740 324 C778 260 789 228 825 228" class="flow"/>
  <path d="M740 324 C780 380 790 425 825 425" class="flow"/>
  <path d="M1080 228 C1115 244 1128 267 1146 292" class="flow"/>
  <path d="M1080 425 C1120 406 1135 376 1147 354" class="flow"/>
  <path d="M1140 382 C995 565 315 570 186 382" class="return"/>

  <!-- Sidecar links -->
  <path d="M510 520 C504 491 502 478 506 460" class="sideLine"/>
  <path d="M700 520 C703 487 696 472 680 460" class="sideLine"/>

  <!-- Labels -->
  <text x="777" y="255" class="tiny">local-first</text>
  <text x="762" y="407" class="tiny">escalate when policy allows</text>
  <text x="612" y="682" class="tiny">Dashed gold path = streamed tokens returning to client</text>
</svg>
